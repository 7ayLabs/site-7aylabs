name: Deploy

on:
  push:
    branches: [main, testing]

permissions:
  contents: read

env:
  IMAGE_NAME: imzzaidd/site-7aylabs

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Docker image tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "testing" ]; then
            echo "tag=${{ env.IMAGE_NAME }}:staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-testing:
    name: Deploy to Testing
    needs: build-and-push
    if: github.ref_name == 'testing'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/site-7aylabs-com
            docker pull ${{ env.IMAGE_NAME }}:staging
            docker compose -f docker-compose.test.yml down --remove-orphans 2>/dev/null || true
            docker rm -f postgres-test site-7aylabs-test nginx-proxy-test 2>/dev/null || true
            docker compose -f docker-compose.test.yml up -d
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' site-7aylabs-test 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Site is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "Health check did not pass within 60s"
            docker logs site-7aylabs-test --tail 20
            exit 1

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/site-7aylabs-com
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f postgres-prod site-7aylabs nginx-proxy 2>/dev/null || true
            docker compose up -d
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' site-7aylabs 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Site is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "Health check did not pass within 60s"
            docker logs site-7aylabs --tail 20
            exit 1
