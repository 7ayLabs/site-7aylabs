services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-7aylabs_db_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - prod_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: imzzaidd/site-7aylabs:latest
    container_name: site-7aylabs
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8082"
      HOSTNAME: "0.0.0.0"
      ALLOWED_ORIGINS: "https://7aylabs.com"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-7aylabs_db_prod}"
    networks:
      - prod_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8082/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: always
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - prod_net
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.25"

volumes:
  pgdata_prod:

networks:
  prod_net:
    driver: bridge
