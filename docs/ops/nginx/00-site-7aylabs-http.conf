# /etc/nginx/conf.d/00-site-7aylabs-http.conf
#
# http-context settings for the 7aylabs.com vhosts. Installed by
# scripts/bootstrap-host.sh. It lives in conf.d (loaded before
# sites-enabled) because `map`, `limit_req_zone` and the real-IP settings
# are only valid at this level, and the vhost file refers to all three.

server_tokens off;

# ── Client address ───────────────────────────────────────────────────────
# Every request reaches nginx from cloudflared on this machine, so the TCP
# peer is always 127.0.0.1. Cloudflare puts the visitor's address in
# CF-Connecting-IP. The header is trusted ONLY when the peer is loopback;
# nginx is bound to 127.0.0.1, so nothing else can connect and set it.
# After this, $remote_addr is the visitor's address everywhere below
# (rate limiting, logs, the headers passed to the app).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   CF-Connecting-IP;

# ── WebSocket upgrade ────────────────────────────────────────────────────
# `upgrade` for a real upgrade request and EMPTY otherwise. Empty rather
# than `close`: sending `Connection: close` (or an unconditional
# `Connection: upgrade`) on ordinary requests defeats the keepalive pool to
# the app and can surface as sporadic 502s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── API rate limit ───────────────────────────────────────────────────────
# A coarse outer limit per visitor address for /api/. The app applies its
# own, stricter per-route limits; this one only stops floods from reaching
# Node at all. 10 MB of state holds about 160,000 addresses.
limit_req_zone   $binary_remote_addr zone=site_api:10m rate=10r/s;
limit_req_status 429;
