# /etc/nginx/snippets/site-7aylabs-proxy.conf
#
# Proxy directives shared by every location in site-7aylabs.conf, so the
# production and staging blocks cannot drift apart. Installed by
# scripts/bootstrap-host.sh. Needs 00-site-7aylabs-http.conf in conf.d
# (it defines $connection_upgrade and the real-IP settings).

proxy_http_version 1.1;

proxy_set_header Host              $host;
# $remote_addr is the visitor's address (see the real-IP settings). These
# two headers are OVERWRITTEN, never appended to, so a visitor cannot
# choose the address the app rate-limits on.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
# TLS ends at Cloudflare and nginx only ever sees plain HTTP on loopback,
# so $scheme would say `http`. Every public request is HTTPS.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Streamed responses (React Server Components) reach the browser as they
# are produced.
proxy_buffering off;
