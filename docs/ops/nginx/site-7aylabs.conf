# /etc/nginx/sites-available/site-7aylabs.conf
#
# Reverse proxy for 7aylabs.com (production) and test.7aylabs.com (staging).
# Installed and enabled by scripts/bootstrap-host.sh.
#
# Traffic path:
#   visitor -> Cloudflare (TLS) -> Cloudflare Tunnel -> cloudflared on this
#   host -> nginx on 127.0.0.1:8080 -> container on 127.0.0.1:7140 / 7141
#
# nginx listens on loopback only and speaks plain HTTP: TLS ends at
# Cloudflare and the tunnel connection is encrypted by cloudflared. There
# is no public port 80 or 443 on this machine and no certificate to renew.
#
# Security headers (CSP, HSTS, frame options) are set by the app. They are
# deliberately not repeated here: two copies of a CSP are both enforced,
# and they drift.

upstream site_7aylabs_prod    { server 127.0.0.1:7140; keepalive 16; }
upstream site_7aylabs_staging { server 127.0.0.1:7141; keepalive 16; }

# ── Catch-all ────────────────────────────────────────────────────────────
# Any Host that is not listed below gets the connection closed with no
# response. This also covers a tunnel route added by mistake.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    access_log off;
    return 444;
}

# ── Production: 7aylabs.com, www.7aylabs.com ─────────────────────────────
server {
    listen 127.0.0.1:8080;
    server_name 7aylabs.com www.7aylabs.com;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=site_api burst=20 nodelay;
        proxy_pass http://site_7aylabs_prod;
        include /etc/nginx/snippets/site-7aylabs-proxy.conf;
    }

    location / {
        proxy_pass http://site_7aylabs_prod;
        include /etc/nginx/snippets/site-7aylabs-proxy.conf;
    }

    access_log /var/log/nginx/7aylabs.com.access.log;
    error_log  /var/log/nginx/7aylabs.com.error.log warn;
}

# ── Staging: test.7aylabs.com ────────────────────────────────────────────
server {
    listen 127.0.0.1:8080;
    server_name test.7aylabs.com;

    client_max_body_size 1m;

    # Keep staging out of search results. `always` so error responses and
    # redirects carry the header too. The deploy smoke test checks for it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=site_api burst=20 nodelay;
        proxy_pass http://site_7aylabs_staging;
        include /etc/nginx/snippets/site-7aylabs-proxy.conf;
    }

    location / {
        proxy_pass http://site_7aylabs_staging;
        include /etc/nginx/snippets/site-7aylabs-proxy.conf;
    }

    access_log /var/log/nginx/test.7aylabs.com.access.log;
    error_log  /var/log/nginx/test.7aylabs.com.error.log warn;
}
