services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-7aylabs_db_test}
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    networks:
      - test_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: imzzaidd/site-7aylabs:staging
    container_name: site-7aylabs-test
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8082"
      HOSTNAME: "0.0.0.0"
      ALLOWED_ORIGINS: "https://test.7aylabs.com"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-7aylabs_db_test}"
    networks:
      - test_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8082/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy-test
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - test_net
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.25"

volumes:
  pgdata_test:

networks:
  test_net:
    driver: bridge
